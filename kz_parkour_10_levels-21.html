<!doctype html><html lang="kk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>KZ PARKOUR</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020712;color:#eef7ff;font-family:Arial,sans-serif}body{display:grid;place-items:center}#game{position:relative;width:min(94vw,900px);height:min(88vh,560px);overflow:hidden;background:linear-gradient(#071b31,#020712)}canvas{width:100%;height:100%;display:block}.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:4;pointer-events:none}.badge{background:#08192bd9;border:1px solid #36e0ff55;border-radius:12px;padding:9px 12px;font-weight:800}.buttons{display:flex;gap:7px;pointer-events:auto}.btn{border:0;border-radius:12px;padding:10px 13px;background:#17304d;color:#fff;font-weight:900}.primary{background:linear-gradient(135deg,#2864ff,#36e0ff);color:#03101a}.overlay{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:#020712b8;backdrop-filter:blur(7px)}.card{width:min(90%,500px);padding:30px;text-align:center;border:1px solid #36e0ff55;border-radius:26px;background:#09172af5;box-shadow:0 20px 70px #0009}.title{font-size:42px;font-weight:1000}.title span{color:#36e0ff}.sub{color:#91a8c2;line-height:1.5}.big{font-size:28px;font-weight:1000}.row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.row .btn{font-size:16px;padding:13px 18px}.controls{position:absolute;z-index:5;left:14px;right:14px;bottom:14px;display:flex;justify-content:space-between;pointer-events:none}.group{display:flex;gap:9px;pointer-events:auto}.ctrl{width:60px;height:60px;border-radius:18px;background:#0b2138dd;color:white;border:1px solid #36e0ff55;font-size:24px;font-weight:900;touch-action:none}.jump{background:#2864ffdd}@media(max-width:600px){#game{width:94vw;height:78vh;min-height:430px;max-height:560px}.title{font-size:32px}.card{padding:23px}.badge{font-size:12px}.ctrl{width:56px;height:56px}}
</style></head><body><div id="game"><canvas id="c" width="1000" height="620"></canvas><div class="hud"><div class="badge">KZ PARKOUR</div><div class="buttons"><div class="badge">Деңгей: <span id="lv">1</span>/10</div><div class="badge">⏱ <span id="tm">0.0</span></div><button class="btn" id="pause">Ⅱ</button></div></div><div class="controls"><div class="group"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div><div class="group"><button class="ctrl jump" id="jump">▲</button></div></div><div class="overlay" id="menu"><div class="card"><div class="title">KZ <span>PARKOUR</span></div><p class="sub">10 деңгей. Кедергілерден өт те мәреге жет!</p><button class="btn primary" id="start">▶ ОЙЫНДЫ БАСТАУ</button><p class="sub">◀ ▶ қозғалу · ▲ секіру</p></div></div><div class="overlay" id="result" style="display:none"><div class="card"><div class="big" id="resultTitle">ОЙЫН АЯҚТАЛДЫ</div><p class="sub" id="resultText"></p><div class="row"><button class="btn primary" id="replay">🔄 ҚАЙТА ОЙНАУ</button><button class="btn" id="toMenu">🏠 МӘЗІРГЕ</button></div></div></div></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),W=1000,H=620;let state='menu',level=1,totalTime=0,levelStart=0,runStart=0,last=0,paused=false;const keys={left:false,right:false};
const P={x:35,y:520,w:28,h:38,vx:0,vy:0,onGround:false};
const GRAV=0.58,JUMP=-6.8,SPEED=2.65,FRIC=.80;
const levels=[
[[0,570,260,50],[285,535,150,22],[455,500,145,22],[620,465,145,22],[785,430,170,22]],
[[0,570,210,50],[235,535,125,22],[390,500,120,22],[540,465,120,22],[690,430,120,22],[840,395,130,22]],
[[0,570,185,50],[210,535,115,22],[350,500,110,22],[485,535,100,22],[615,495,110,22],[750,455,110,22],[885,415,100,22]],
[[0,570,170,50],[195,535,100,22],[320,500,100,22],[445,535,95,22],[565,495,100,22],[685,455,100,22],[805,415,110,22]],
[[0,570,155,50],[180,535,90,22],[295,505,90,22],[410,535,85,22],[520,500,85,22],[630,465,85,22],[740,430,85,22],[850,395,110,22]],
[[0,570,145,50],[170,535,85,22],[280,505,80,22],[385,470,80,22],[490,505,80,22],[595,470,80,22],[700,435,80,22],[805,400,90,22],[920,365,70,22]],
[[0,570,135,50],[160,535,75,22],[260,505,75,22],[360,470,75,22],[460,505,75,22],[560,470,75,22],[660,435,75,22],[760,400,75,22],[860,365,100,22]],
[[0,570,125,50],[150,535,70,22],[245,505,70,22],[340,470,70,22],[435,505,70,22],[530,470,70,22],[625,435,70,22],[720,400,70,22],[815,365,70,22],[910,330,70,22]],
[[0,570,115,50],[140,535,65,22],[230,505,65,22],[320,470,65,22],[410,505,65,22],[500,470,65,22],[590,435,65,22],[680,400,65,22],[770,365,65,22],[860,330,65,22],[935,295,60,22]],
[[0,570,105,50],[130,535,60,22],[215,505,60,22],[300,470,60,22],[385,505,60,22],[470,470,60,22],[555,435,60,22],[640,400,60,22],[725,365,60,22],[810,330,60,22],[895,295,90,22]]
];
function platforms(){return levels[level-1]}
function resetPlayer(){P.x=35;P.y=530;P.vx=0;P.vy=0;P.onGround=false}
function startNew(){level=1;totalTime=0;runStart=performance.now();levelStart=performance.now();resetPlayer();state='play';paused=false;document.getElementById('menu').style.display='none';document.getElementById('result').style.display='none';document.getElementById('pause').textContent='Ⅱ'}
function replay(){startNew()}
function die(){state='dead';document.getElementById('resultTitle').textContent='💥 ОЙЫН АЯҚТАЛДЫ';document.getElementById('resultText').innerHTML=`Деңгей: <b>${level}/10</b><br>Өтілген деңгей: <b>${Math.max(0,level-1)}</b><br>Уақыт: <b>${totalTime.toFixed(1)} сек</b>`;document.getElementById('result').style.display='grid'}
function menu(){state='menu';document.getElementById('result').style.display='none';document.getElementById('menu').style.display='grid';paused=false}
function jump(){if(state==='play'&&!paused&&P.onGround){P.vy=JUMP;P.onGround=false}}
function rects(){return platforms().map(a=>({x:a[0],y:a[1],w:a[2],h:a[3]}))}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function update(dt){if(state!=='play'||paused)return;if(keys.left)P.vx-=.32*dt;if(keys.right)P.vx+=.32*dt;P.vx=Math.max(-SPEED,Math.min(SPEED,P.vx));if(!keys.left&&!keys.right)P.vx*=Math.pow(FRIC,dt);P.x+=P.vx*dt;let rs=rects();for(const r of rs){if(hit(P,r)){if(P.vx>0)P.x=r.x-P.w;else if(P.vx<0)P.x=r.x+r.w;P.vx=0}}
P.vy+=GRAV*dt;let oldY=P.y;P.y+=P.vy*dt;P.onGround=false;for(const r of rs){if(hit(P,r)){if(P.vy>=0&&oldY+P.h<=r.y+4){P.y=r.y-P.h;P.vy=0;P.onGround=true}else if(P.vy<0&&oldY>=r.y+r.h-4){P.y=r.y+r.h;P.vy=0}}}
if(P.x<0)P.x=0;if(P.x>W-P.w)P.x=W-P.w;if(P.y>H+40){die();return}let lastPlat=rs[rs.length-1];if(P.x+P.w>lastPlat.x&&P.x<lastPlat.x+lastPlat.w&&P.y+P.h<=lastPlat.y+18&&P.y+P.h>=lastPlat.y-8){if(level<10){totalTime=(performance.now()-runStart)/1000;level++;resetPlayer();levelStart=performance.now()}else{state='win';document.getElementById('resultTitle').textContent='🏆 ЖЕҢІС!';document.getElementById('resultText').innerHTML=`10 деңгейдің бәрі өтті!<br>Жалпы уақыт: <b>${totalTime.toFixed(1)} сек</b>`;document.getElementById('result').style.display='grid'}}totalTime=(performance.now()-runStart)/1000;}
function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#092744');g.addColorStop(1,'#020712');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<50;i++){ctx.fillStyle='#ffffff33';ctx.fillRect((i*83)%W,(i*47)%H,2,2)}for(const r of rects()){ctx.fillStyle='#2464dc';ctx.fillRect(r.x,r.y,r.w,r.h);ctx.fillStyle='#36e0ff';ctx.fillRect(r.x,r.y,r.w,4)}let lastP=rects()[rects().length-1];ctx.fillStyle='#ffdf63';ctx.fillRect(lastP.x+lastP.w-16,lastP.y-65,12,65);ctx.fillStyle='#ffdf63';ctx.font='bold 12px Arial';ctx.fillText('FINISH',lastP.x+lastP.w-50,lastP.y-72);ctx.fillStyle='#36e0ff';ctx.shadowBlur=22;ctx.shadowColor='#36e0ff';ctx.fillRect(P.x,P.y,P.w,P.h);ctx.shadowBlur=0;ctx.fillStyle='#07111f';ctx.fillRect(P.x+7,P.y+8,5,5);ctx.fillRect(P.x+17,P.y+8,5,5)}
function loop(t){let dt=Math.min((t-last)/16.67,2);last=t;update(dt);draw();document.getElementById('lv').textContent=level;document.getElementById('tm').textContent=totalTime.toFixed(1);requestAnimationFrame(loop)}
function bindHold(id,key){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();keys[key]=true};['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[key]=false))}
bindHold('left','left');bindHold('right','right');document.getElementById('jump').onpointerdown=e=>{e.preventDefault();jump()};document.getElementById('start').onclick=startNew;document.getElementById('replay').onclick=replay;document.getElementById('toMenu').onclick=menu;document.getElementById('pause').onclick=()=>{if(state==='play'){paused=!paused;document.getElementById('pause').textContent=paused?'▶':'Ⅱ'}};addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key==='ArrowUp'||e.key===' ')jump();if(e.key.toLowerCase()==='p'&&state==='play')document.getElementById('pause').click()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false});last=performance.now();requestAnimationFrame(loop);
</script></body></html>
